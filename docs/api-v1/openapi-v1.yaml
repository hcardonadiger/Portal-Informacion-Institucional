# =============================================================================
# ESTE ARCHIVO SE GENERA. No lo edite a mano: la próxima regeneración lo pisa.
#
# Lo produce el código de src/Api — las rutas, los tipos de respuesta y los
# comentarios XML de los controladores — y lo vigila
# tests/Api.Tests/EspecificacionPublicadaTests.cs, que falla si este archivo
# y el código dejan de coincidir.
#
# Para regenerarlo después de cambiar la API:
#
#     ACTUALIZAR_SPEC=1 dotnet test tests/Api.Tests
#
# Lo que una especificación no sabe decir —cómo integrarse, las dos cadencias de
# sincronización, qué significa fichaCompleta, dónde vive cada ambiente— está en
# docs/api-v1/README.md, que sí se escribe a mano.
# =============================================================================
openapi: 3.0.1
info:
  title: DIGER — API pública de trámites (v1)
  description: "Publica el inventario oficial de trámites del Estado para que otros sistemas lo consuman. Hoy su único consumidor es HondurasÁgil.\n\n**Solo lectura.** No hay POST, PUT ni DELETE, y no los habrá en la v1: los trámites se editan en PortalDigital, no por aquí.\n\n**Solo lo publicado.** Un trámite sin publicar no existe para esta API. Por eso un código no publicado devuelve 404 igual que uno inexistente: distinguirlos delataría qué códigos hay.\n\n### Cómo autenticarse\nPulse **Authorize** y pegue la clave. Viaja en la cabecera `X-Api-Key`. `/api/v1/salud` es la única ruta que no la pide, para que un monitor externo no tenga que custodiar un secreto.\n\n### Cómo sincronizar\nSon dos rutas que se complementan, y hacen falta las dos:\n\n- `/cambios?desde=` trae lo que cambió. Es el día a día.\n- `/codigos-publicados` trae todos los códigos vivos. Sirve para **retirar bajas**, que es lo que `/cambios` no puede reportar: un trámite dado de baja no deja ninguna fila que devolver.\n\nConviene además forzar un ciclo completo cada tanto. `/cambios` se apoya en la fecha de modificación, así que una publicación hecha con un UPDATE directo contra la base no la toca y sería invisible para siempre."
  version: v1
paths:
  /api/v1/cambios:
    get:
      tags:
        - Cambios
      summary: Códigos que cambiaron desde una fecha — sincronización incremental.
      description: "Devuelve solo los códigos, no las fichas: el consumidor pide luego el detalle de cada\nuno. Junto a los códigos viene `generadoEl`, **la hora del servidor**: guárdela y úsela\ncomo `desde` en la siguiente llamada. Usar el reloj propio pierde una franja de cambios\nen cada ciclo si los dos relojes no coinciden.\n            \n**Esta ruta no reporta bajas.** Un trámite retirado no deja ninguna fila que devolver,\nasí que hay que contrastar contra /api/v1/codigos-publicados para retirarlas.\n            \n**Y tiene un punto ciego:** se apoya en la fecha de modificación, que un UPDATE directo\ncontra la base no toca. Conviene forzar un ciclo completo cada cierto tiempo."
      parameters:
        - name: desde
          in: query
          description: 'Fecha ISO 8601, por ejemplo 2026-08-01T00:00:00Z. Es obligatorio.'
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CambiosPublicosDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CambiosPublicosDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CambiosPublicosDto'
        '400':
          description: "Falta `desde`. Antes se enlazaba a 0001-01-01 y la ruta devolvía el\n             catálogo entero en silencio: no perdía datos, pero convertía un error del cliente en\n             tráfico invisible."
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
  /api/v1/codigos-publicados:
    get:
      tags:
        - Cambios
      summary: Todos los códigos publicados ahora mismo. Es la lista de lo que está vivo.
      description: "Sirve para lo que /api/v1/cambios no puede hacer: **detectar bajas**. Lo que el\nconsumidor tenga guardado y no aparezca aquí, ya no existe y debe retirarlo.\n            \nRegla importante para quien la consuma: si esta ruta no responde, **no borre nada**.\nConfundir «no pude preguntar» con «ya no existe nada» vacía un portal entero por un\nfallo de red de dos segundos."
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: string
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
  /api/v1/categorias:
    get:
      tags:
        - CategoriasPublicas
      summary: 'Las categorías en que se agrupan los trámites, con cuántos hay publicados en cada una.'
      description: "El conteo cuenta **solo lo publicado**, así que una categoría puede salir en 0 aunque\nexistan trámites suyos sin publicar. El Id que devuelve es el que espera el parámetro\n`categoria` del catálogo."
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaPublicaDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaPublicaDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaPublicaDto'
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
  /api/v1/instituciones:
    get:
      tags:
        - InstitucionesPublicas
      summary: 'Las instituciones activas, con sus datos de contacto y cuántos trámites publican.'
      description: "Solo salen las **activas**. Una institución dada de alta pero aún sin aprobar no\naparece aquí, aunque sus trámites sí puedan estar publicados.\n            \nLa sigla que devuelve (por ejemplo INPREMA) es la que espera el parámetro\n`institucion` del catálogo."
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitucionPublicaDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitucionPublicaDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitucionPublicaDto'
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
  /api/v1/salud:
    get:
      tags:
        - Salud
      summary: Si la API responde y si alcanza su base de datos.
      description: "**La única ruta sin clave**, y es a propósito: un monitor externo no debería tener que\ncustodiar un secreto para comprobar que el servicio está en pie.\n            \nDevuelve también `horaServidor`. Un consumidor debe usar esa hora, y no la suya,\ncomo referencia para sincronizar.\n            \nSi `baseDeDatos` viene en `false` el problema es la cadena de conexión, no\nla API: el proceso está vivo pero no puede servir datos."
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
            application/json:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
            text/json:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
        '503':
          description: La API está en pie pero no alcanza su base de datos.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
            application/json:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
            text/json:
              schema:
                $ref: '#/components/schemas/SaludPublicaDto'
  /api/v1/tramites:
    get:
      tags:
        - TramitesPublicos
      summary: 'Catálogo de trámites publicados, paginado.'
      description: "Devuelve la ficha resumida: lo justo para pintar una lista. Para el detalle completo\n—pasos, requisitos, entregables, lugares y enlaces— hay que pedir cada trámite por su\ncódigo.\n            \nLos filtros se combinan con Y, no con O: pedir institución y modalidad a la vez\ndevuelve los que cumplen las dos cosas."
      parameters:
        - name: busqueda
          in: query
          description: "Texto libre. Es coincidencia parcial sobre <b>nombre, descripción\n             y objetivo</b>, y no distingue tildes ni mayúsculas: «migracion» encuentra «Migración».\n             Esa insensibilidad la garantiza la colación de esas columnas, no el código.\n             <b>No busca por código ni por institución</b>: para eso están el parámetro\n             `institucion` y la ruta de detalle por código."
          schema:
            type: string
        - name: categoria
          in: query
          description: Id numérico de la categoría. La lista está en /api/v1/categorias.
          schema:
            type: integer
            format: int32
        - name: institucion
          in: query
          description: "Sigla de la institución, tal como sale en /api/v1/instituciones\n             (por ejemplo INPREMA). No es el nombre largo."
          schema:
            type: string
        - name: modalidad
          in: query
          description: "Presencial, Virtual o Hibrido — sin tilde y con esa grafía\n             exacta. Cuidado con una asimetría deliberada: `modalidad=Virtual` devuelve\n             **también los híbridos**, porque un trámite híbrido también se puede hacer en línea y\n             filtrar solo por Virtual subestimaría cuántos trámites hay en línea.\n             `modalidad=Hibrido`, en cambio, devuelve solo híbridos."
          schema:
            type: string
        - name: soloGratuitos
          in: query
          description: Solo los que no cuestan nada.
          schema:
            type: boolean
            default: false
        - name: soloEnSol
          in: query
          description: Solo los que ya se pueden hacer en línea.
          schema:
            type: boolean
            default: false
        - name: soloFichasCompletas
          in: query
          description: "Solo los que tienen categoría, modalidad, tiempo y\n             costo. Es el filtro que debe usar un portal de cara al ciudadano: sin él pueden salir\n             fichas sin plazo ni costo, que al ciudadano le sirven de poco."
          schema:
            type: boolean
            default: false
        - name: orden
          in: query
          description: "Solo se reconoce `nombre`, que ordena de la A a la Z.\n             Cualquier otro valor —y no mandar ninguno— pone primero los marcados como populares y\n             dentro de cada grupo ordena por nombre. No existe orden por institución ni por tiempo:\n             pedirlos no da error, simplemente cae en ese orden por omisión."
          schema:
            type: string
        - name: pagina
          in: query
          description: Desde 1. Un número menor se trata como 1.
          schema:
            type: integer
            format: int32
            default: 1
        - name: tamano
          in: query
          description: "Entre 1 y 100. Un valor fuera de ese intervalo no da error, pero\n             tampoco se recorta: **vuelve al valor por omisión, 20**. Pedir 500 devuelve 20, no 100."
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogoPublicoDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoPublicoDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogoPublicoDto'
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
  '/api/v1/tramites/{codigo}':
    get:
      tags:
        - TramitesPublicos
      summary: 'Ficha completa de un trámite, por su código.'
      description: "La identidad pública es el **código** (por ejemplo 603-019), no el Id interno. El Id\ninterno no viaja nunca: es un detalle de esta base y podría cambiar.\n            \nTrae el detalle entero: pasos, requisitos, entregables, lugares de atención y enlaces."
      parameters:
        - name: codigo
          in: path
          description: 'Código del trámite, tal como aparece en el catálogo.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TramiteDetallePublicoDto'
            application/json:
              schema:
                $ref: '#/components/schemas/TramiteDetallePublicoDto'
            text/json:
              schema:
                $ref: '#/components/schemas/TramiteDetallePublicoDto'
        '404':
          description: "No existe, o no está publicado. **Son el mismo código a\n             propósito**: distinguirlos permitiría averiguar qué códigos existen sin verlos."
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Falta la cabecera X-Api-Key, o la clave no es válida.'
      security:
        - ApiKey: [ ]
